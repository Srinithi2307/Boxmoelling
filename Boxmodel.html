<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            width: 400px;
            background-color: white;
            padding: 40px;
            text-align: center;
            border: 5px dashed #2196f3;
            border-top: 5px solid #2196f3;
            border-bottom: 5px solid #2196f3;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .profile-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px dashed #2196f3;
            margin-bottom: 25px;
        }

        h2 {
            color: #1565c0;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
        }

        .profile-button {
            display: inline-block;
            background-color: #2196f3;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .profile-button:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="sri.jpeg" alt="Student Profile" class="profile-image">

        <h2>Student Profile</h2>

        <p>
            I am a beginner learning HTML and CSS web development.
        </p>

        <button class="profile-button">View Profile
        </button>

    </div>

</body>
</html>
